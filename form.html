<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="index.php" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Spongebob" minlength="5" maxlength="10" required>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
        <br>
        <label for="password">Password:
             </label>
        <input type="password" id="password" required>
        <br>
        <label for="email" >Email:</label>
        <input type="email" id="email" placeholder="Ssquare@gmail.com">
        <br>
        <label for="Phone">Phone #:</label>
        <input type="tel" id="Phone" placeholder="018--------" pattern="[0-9]{11}" required>
        <br>
        <label for="bday">Birthdate:</label>
        <input type="date" id="bday">
        <br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" value="1" min="0" max="99">
        <br>

        <label for="title">Title:</label>
        <label for="Mr">Mr.</label>

        <input type="radio" id="Mr" name="title">
        <label for="Mrs">Mrs.</label>
        <input type="radio" id="Mrs" name="title">
        <label for="PHD">PHD.</label>
        <input type="radio" id="PHD" name="title">
        <br>
        <label for="payment">Payment:</label>
        <select id="payment">
            <option value="VISA">VISA</option>
            <option value="Mastercard">Mastercard</option>
            <option value="Gift Card">Gift Card</option>
        </select>
        <br>
        <label for="Subscribe">Subscribe:</label>
        <input type="checkbox" id="Subscribe">
        <br>
        <label for="comment">Comment:</label>
        <textarea id="comment" rows="5" cols="25"></textarea>
        <br>
        <label for="file">file:</label>
        <input type="file" id="file" accept="image/png,image/jpeg">
        <br>
        <input type="reset">
        <br>
          <input type="submit" >
    </form>
</body>
</html>
